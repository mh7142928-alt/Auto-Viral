name: Automated Twice-Daily Shorts Publisher

on:
  schedule:
    # Trigger 1: 11:30 AM UTC (~2:30 PM KSA/Local) - Afternoon Viral Short
    - cron: '30 11 * * *'
    # Trigger 2: 05:30 PM UTC (~8:30 PM KSA/Local) - Evening Viral Short
    - cron: '30 17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg & Arabic Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish Short to YouTube, Instagram & TikTok
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
        run: |
          python main.py

      - name: Archive Generated Video & Publishing Log
        uses: actions/upload-artifact@v4
        with:
          name: daily-published-short-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
            output/*.jsonl
          retention-days: 14
