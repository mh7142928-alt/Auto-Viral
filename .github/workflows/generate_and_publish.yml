name: Automated Daily Shorts Generator

on:
  schedule:
    # Runs twice daily (e.g. 11:30 UTC and 17:30 UTC)
    - cron: '30 11,17 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-cjk

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Short Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VOICE_NAME: ${{ vars.VOICE_NAME || 'ar-SA-HamedNeural' }}
        run: |
          python main.py

      - name: Upload Video Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: generated-shorts-${{ github.run_id }}
          path: output/
          retention-days: 7
